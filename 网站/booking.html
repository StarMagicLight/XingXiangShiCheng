<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动预约</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #f5f5f5;
        }
        
        .booking-container {
            max-width: 480px;
            margin: 60px auto 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 36px 32px 28px 32px;
        }
        
        .booking-title {
            text-align: center;
            font-size: 2rem;
            color: #b85c00;
            margin-bottom: 28px;
            letter-spacing: 2px;
        }
        
        .booking-form label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .booking-form input,
        .booking-form select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: 1px solid #e0c9a6;
            border-radius: 6px;
            font-size: 1rem;
            background: #faf8f6;
        }
        
        .booking-form input[type="date"] {
            color: #666;
        }
        
        .booking-form button {
            width: 100%;
            background: #b85c00;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .booking-form button:hover {
            background: #a04a00;
        }
        
        .booking-success {
            text-align: center;
            color: #2e7d32;
            font-size: 1.1rem;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <div class="booking-container">
        <div class="booking-title">活动预约</div>
        <form class="booking-form" id="bookingForm">
            <label for="activity">预约活动</label>
            <select id="activity" name="activity" required>
                <option value="">请选择活动</option>
                <option value="柿子采摘体验">柿子采摘体验</option>
                <option value="柿染工艺体验">柿染工艺体验</option>
                <option value="掐丝珐琅体验">掐丝珐琅体验</option>
                <option value="绒花柿子制作">绒花柿子制作</option>
                <option value="柿子文化研学">柿子文化研学</option>
                <option value="柿子美食制作">柿子美食制作</option>
                <option value="柿子园观光">柿子园观光</option>
                <option value="柿子摄影之旅">柿子摄影之旅</option>
            </select>
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
            <label for="phone">手机号</label>
            <input type="tel" id="phone" name="phone" placeholder="请输入手机号" pattern="^1[3-9]\d{9}$" required>
            <label for="count">人数</label>
            <input type="number" id="count" name="count" placeholder="请输入人数" min="1" step="1" required>
            <label for="date">预约日期</label>
            <input type="date" id="date" name="date" required>
            <button type="submit">提交预约</button>
            <div class="booking-success" id="successMsg" style="display:none;">预约成功！我们会尽快与您联系。</div>
        </form>
    </div>
    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('successMsg').style.display = 'block';
            setTimeout(function() {
                document.getElementById('successMsg').style.display = 'none';
                document.getElementById('bookingForm').reset();
            }, 2500);
        });
    </script>
</body>

</html>
