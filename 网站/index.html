<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荥想柿成 - 首页</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header class="main-header">
        <nav class="top-nav">
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="services.html">业务服务</a></li>
                <li><a href="products.html">产品服务</a></li>
                <li><a href="new.html">活动中心</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-image">
                <img src="images/i.png" alt="柿子图片">
                <h1>荥想柿成</h1>
            </div>
        </div>
    </section>

    <section class="main-services">
        <div class="service-cards">
            <div class="service-card">
                <a href="products.html">
                    <h2>产品</h2>
                    <p>Products</p>
                    <div class="card-dot"></div>
                </a>
            </div>
            <div class="service-card">
                <a href="services.html">
                    <h2>服务</h2>
                    <p>Services</p>
                    <div class="card-dot"></div>
                </a>
            </div>
            <div class="service-card">
                <a href="new.html">
                    <h2>活动</h2>
                    <p>Activities</p>
                    <div class="card-dot"></div>
                </a>
            </div>
        </div>
    </section>

    <section class="product-showcase">
        <div class="product-grid">
            <img src="images/i1.png" alt="柿子展示">
            <img src="images/i2.png" alt="柿子展示">
            <img src="images/i3.png" alt="柿子展示">
            <img src="images/i4.png" alt="柿子展示">
            <img src="images/i5.png" alt="柿子展示">
        </div>
    </section>

    <section class="contact-section">
        <h2>联系我们</h2>
        <p class="contact-subtitle">Contact Us</p>
        <div class="contact-form">
            <input type="text" placeholder="您的姓名">
            <input type="text" placeholder="联系方式">
        </div>
        <div class="map-container">
            <img src="images/map.png" alt="地图">
        </div>
    </section>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-nav">
                <a href="index.html">首页</a>
                <a href="about.html">关于我们</a>
                <a href="services.html">业务服务</a>
                <a href="products.html">产品服务</a>
                <a href="new.html">活动中心</a>
            </div>
            <div class="footer-logo">
                <img src="images/logo.png" alt="荥想柿成">
            </div>
        </div>
    </footer>
</body>

</html>
