<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荥想柿成 - 首页</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">首页</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">关于我们</a></li>
                <li class="nav-item"><a href="products1.html" class="nav-link">产品服务</a></li>
                <li class="nav-item"><a href="new.html" class="nav-link">活动中心</a></li>
            </ul>
        </div>
    </nav>
    <div class="top-image">
        <img src="产品服务/题头图.jpg" alt="顶部图片">
    </div>
    <section class="hero">
        <div class="hero-content">
            <div class="hero-image">
                <img src="images/i.png" alt="柿子图片">
                <h1>荥想柿成</h1>
            </div>
        </div>
    </section>

    <section class="main-services">
        <div class="service-cards">
            <div class="service-card">
                <a href="products.html">
                    <h2>产品</h2>
                    <p>Products</p>
                    <div class="card-dot"></div>
                </a>
            </div>
            <div class="service-card">
                <a href="about.html">
                    <h2>关于我们</h2>
                    <p>About Us</p>
                    <div class="card-dot"></div>
                </a>
            </div>
            <div class="service-card">
                <a href="new.html">
                    <h2>活动</h2>
                    <p>Activities</p>
                    <div class="card-dot"></div>
                </a>
            </div>
        </div>
    </section>

    <section class="product-showcase">
        <div class="product-grid">
            <img src="images/i1.png" alt="柿子展示">
            <img src="images/i2.png" alt="柿子展示">
            <img src="images/i3.png" alt="柿子展示">
            <img src="images/i4.png" alt="柿子展示">
            <img src="images/i5.png" alt="柿子展示">
        </div>
    </section>

    <section class="contact-section">
        <h2>联系我们</h2>
        <p class="contact-subtitle">Contact Us</p>
        <div class="contact-form">
            <input type="text" placeholder="您的姓名">
            <input type="text" placeholder="联系方式">
        </div>
        <div class="map-container">
            <img src="images/map.png" alt="地图">
        </div>
    </section>


</body>

</html>
