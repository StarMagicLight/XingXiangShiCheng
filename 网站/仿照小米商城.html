<!DOCTYPE html>
<html lang="zh-CN">

<head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="荥想柿成">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我们</a></li>
                <li><a href="services.html">业务服务</a></li>
                <li><a href="products.html">产品服务</a></li>

        <div class="search-bar">
            <input type="text" placeholder="搜索产品...">

    <section class="banner">
        <div class="slider">

    <section class="featured-products">
        <h2>推荐产品</h2>
        <div class="product-list">
            <div class="product-item">
                <img src="images/product1.jpg" alt="荥阳柿子A">

                <p>精选优质柿子，口感甜美，营养丰富。</p>

            <div class="product-item">
                <img src="images/product2.jpg" alt="荥阳柿子B">
                <h3>荥阳柿子B</h3>
                <p>传统工艺制作，保留原汁原味。</p>
                <button>立即购买</button>
            </div>
            <div class="product-item">
                <img src="images/product3.jpg" alt="荥阳柿子C">
                <h3>荥阳柿子C</h3>
                <p>适合各种场合，送礼自用两相宜。</p>
                <button>立即购买</button>
