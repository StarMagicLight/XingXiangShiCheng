<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高端产品定制</title>
    <link rel="stylesheet" href="customization.css">
</head>

<body>
    <div class="customization-container">
        <h2 class="section-title">高端产品定制</h2>
        <div class="customization-content">
            <!-- 节日礼盒样品展示 -->
            <section class="gift-box-section">
                <h3>节日礼盒样品展示</h3>
                <div class="gift-box-grid">
                    <div class="gift-box-card">
                        <div class="gift-box-image">
                            <img src="images/gift-box1.jpg" alt="节日礼盒1">
                        </div>
                        <div class="gift-box-info">
                            <h4>经典红色礼盒</h4>
                            <p>适合春节、中秋等传统节日</p>
                            <button class="inquiry-btn" onclick="openChat()">立即咨询</button>
                        </div>
                    </div>
                    <div class="gift-box-card">
                        <div class="gift-box-image">
                            <img src="images/gift-box2.jpg" alt="节日礼盒2">
                        </div>
                        <div class="gift-box-info">
                            <h4>简约商务礼盒</h4>
                            <p>适合商务场合、企业礼品</p>
                            <button class="inquiry-btn" onclick="openChat()">立即咨询</button>
                        </div>
                    </div>
                    <div class="gift-box-card">
                        <div class="gift-box-image">
                            <img src="images/gift-box3.jpg" alt="节日礼盒3">
                        </div>
                        <div class="gift-box-info">
                            <h4>创意定制礼盒</h4>
                            <p>支持个性化设计</p>
                            <button class="inquiry-btn" onclick="openChat()">立即咨询</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 特殊需求咨询 -->
            <section class="special-request-section">
                <h3>特殊需求请联系我们</h3>
                <div class="contact-options">
                    <div class="contact-card">
                        <i class="icon-chat"></i>
                        <h4>在线客服</h4>
                        <p>7x24小时在线服务</p>
                        <a href="chat.html">在线客服</a>
                    </div>
                    <div class="contact-card">
                        <i class="icon-phone"></i>
                        <h4>电话咨询</h4>
                        <p>400-123-4567</p>
                        <a href="tel:400-123-4567" class="call-btn">立即拨打</a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>

</html>
