<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约活动</title>
    <link rel="stylesheet" href="reservation.css">
</head>

<body>
    <div class="reservation-container">
        <h2>预约活动</h2>
        <form class="reservation-form">
            <div class="form-group">
                <label for="reservation-date">选择日期：</label>
                <input type="date" id="reservation-date" required>
            </div>
            <div class="form-group">
                <label for="number-of-people">预约人数：</label>
                <input type="number" id="number-of-people" min="1" max="10" required>
            </div>
            <div class="form-group">
                <label for="contact-info">联系方式：</label>
                <input type="tel" id="contact-info" placeholder="请输入您的手机号码" required>
            </div>
            <button type="submit" class="submit-btn">提交预约</button>
        </form>
    </div>
</body>

</html>
