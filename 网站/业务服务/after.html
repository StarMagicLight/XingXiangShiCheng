<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后服务</title>
    <link rel="stylesheet" href="after.css">
</head>

<body>
    <div class="after-sales-container">
        <!-- 留言板部分 -->
        <section class="feedback-section">
            <h2>用户留言板</h2>
            <div class="feedback-form">
                <textarea placeholder="请留下您的宝贵意见..." id="feedback-input"></textarea>
                <div class="upload-area">
                    <label for="image-upload" class="upload-btn">
                <i class="icon-camera"></i> 上传图片
              </label>
                    <input type="file" id="image-upload" accept="image/*" multiple>
                    <button onclick="submitFeedback()">提交留言</button>
                </div>
            </div>
            <div class="feedback-list" id="feedback-list">
                <!-- 留言将动态插入到这里 -->
            </div>
        </section>

        <!-- 投诉部分 -->
        <section class="complaint-section">
            <h2>投诉建议</h2>
            <div class="complaint-form">
                <textarea placeholder="请详细描述您的问题..." id="complaint-input"></textarea>
                <button onclick="submitComplaint()">提交投诉</button>
            </div>
        </section>
    </div>
</body>

</html>
